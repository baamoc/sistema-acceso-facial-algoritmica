{% extends 'base.html' %}{% block title %}Control de acceso{% endblock %}{% block body %}
<main class="public"><a class="admin-link" href="{{ url_for('admin.login') }}">Administrador</a><h1>Control de acceso facial</h1><section class="camera-card"><img src="{{ url_for('public.video_feed') }}" alt="Video de cámara"><div id="state" class="state waiting">ESPERANDO ROSTRO</div></section><section class="info"><h2 id="name">—</h2><p id="reason">Acerque su rostro a la cámara.</p><div><span>CI</span><strong id="ci">—</strong></div><div><span>Vigencia</span><strong id="expiry">—</strong></div><div><span>Número de accesos</span><strong id="accesses">0</strong></div></section></main>
<script>async function update(){try{let s=await fetch('/api/status').then(x=>x.json()),e=document.querySelector('#state');e.textContent=s.result;e.className='state '+(s.result==='ACCESO PERMITIDO'?'allowed':s.result==='ACCESO DENEGADO'?'denied':s.result==='DESCONOCIDO'?'unknown':'waiting');document.querySelector('#name').textContent=s.name;document.querySelector('#reason').textContent=s.camera_error||s.reason;document.querySelector('#ci').textContent=s.ci;document.querySelector('#expiry').textContent=s.expiry;document.querySelector('#accesses').textContent=s.accesses}catch(e){}}setInterval(update,500);update()</script>{% endblock %}
