{% extends 'base.html' %}{% block body %}<main class="admin"><a href="{{url_for('admin.dashboard')}}">← Clientes</a><h1>Historial: {{client.nombre_completo}}</h1><p>Accesos permitidos: <strong>{{count}}</strong></p><table><thead><tr><th>Fecha y hora</th><th>Resultado</th><th>Motivo</th></tr></thead><tbody>{% for e in events %}<tr><td>{{e.fecha_hora}}</td><td>{{e.resultado}}</td><td>{{e.motivo}}</td></tr>{% else %}<tr><td colspan="3">Sin eventos.</td></tr>{% endfor %}</tbody></table></main>{% endblock %}
